name: Run tutorial (dry run)

on:
  push:
    branches: [main]
    paths: ['index.js', 'test.js', '.github/workflows/run.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tests + run
        run: |
          {
            echo "\$ node test.js"
            node test.js
            echo
            echo "\$ node index.js"
            echo "# GitHub Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "# runner: $(uname -sr), node $(node --version), UTC $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            node index.js 2>&1
            echo "# exit code: $?"
          } | tee run-output.txt
      - name: Commit run output to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run-output.txt
          git commit -m "Run output from Actions run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push
