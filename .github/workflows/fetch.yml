name: fetch
on: { workflow_dispatch: {}, push: { paths: ['fetch-eval.mjs'] } }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node fetch-eval.mjs 2>&1 | tee eval-dump.txt
      - uses: actions/upload-artifact@v4
        with: { name: eval-dump, path: eval-dump.txt }
